    <link href="assets/css/style.css" rel="stylesheet">

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary-dark">
    <div class="container">
        <a class="navbar-brand" href="index.php"><i class="bi bi-mortarboard-fill me-2"></i>Campus Registry</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="index.php">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item ms-lg-2"><a class="btn btn-light btn-sm active" href="register.html">Register</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="auth-shell">
        <header class="auth-header">
            <span class="feature-icon mb-3"><i class="bi bi-person-plus"></i></span>
            <h1 class="h2">Create your account</h1>
            <p class="text-body-secondary">Register to start managing student records.</p>
        </header>
        <div class="form-card">
            <div id="formAlert" class="alert" role="alert" hidden></div>
            <form action="register.php" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9_]+" required autofocus>
                    <div class="form-text">3–50 letters, numbers, or underscores.</div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="email" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group password-group">
                        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required>
                        <button class="btn btn-outline-secondary" type="button" data-password-toggle="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="form-text">At least 8 characters with a letter and a number.</div>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Create account</button>
            </form>
        </div>
        <p class="text-center text-body-secondary mt-4 mb-0">Already have an account? <a href="login.html" class="text-primary fw-semibold">Log in</a></p>
    </div>
</main>
